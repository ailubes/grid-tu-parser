name: Diagnose registry HTML

on:
  push:
    branches:
      - diag/live-registry-html
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/diagnose_registry.py
